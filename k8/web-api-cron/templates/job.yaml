apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-cron
spec:
  schedule: {{ .Values.schedule }}
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: cron-example
              image: kubes-example
              imagePullPolicy: Never
              command: ["cron"]
          restartPolicy: Never
