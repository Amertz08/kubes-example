apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels:
    app: {{ .Release.Name }}-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: {{ .Release.Name }}-api
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-api
    spec:
      containers:
        - name: api
          image: kubes-example
          imagePullPolicy: Never
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  key: {{ .Values.dbSecrets.userKey }}
                  name: {{ .Values.dbSecrets.name }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: {{ .Values.dbSecrets.passwordKey }}
                  name: {{ .Values.dbSecrets.name }}
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  key: {{ .Values.dbSecrets.dbNameKey}}
                  name: {{ .Values.dbSecrets.name }}
          ports:
            - containerPort: 8000
              name: api-port
          livenessProbe:
            httpGet:
              port: 8000
              path: /healthcheck
            initialDelaySeconds: 3
            periodSeconds: 3
